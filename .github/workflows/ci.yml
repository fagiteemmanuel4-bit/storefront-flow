name: Strap CI

on:
  push:
    branches: [main, feat/strap-ui-overhaul, comprehensive-audit-20260823]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --no-save
      - name: Lint
        run: bun run lint
      - name: Type check
        if: always()
        run: bunx tsc --noEmit
      - name: Production build
        if: always()
        run: bun run build
      - name: Dependency audit report
        if: always()
        run: bun audit || true
      - name: Block high and critical dependency vulnerabilities
        if: always()
        run: bun audit --audit-level=high
