name: Strap CI

on:
  push:
    branches: [main, feat/strap-ui-overhaul, comprehensive-audit-20260823]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate migration timestamps
        run: node scripts/check-migration-versions.mjs
      - name: Setup Bun
        run: |
          npm install --global bun@1.3.14 --no-audit --no-fund
          bun --version
      - name: Install dependencies
        run: bun install --no-save
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every Supabase Edge Function
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "::group::Deno check $file"
            deno check --no-lock --node-modules-dir=auto "$file"
            echo "::endgroup::"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name 'index.ts' -print0 | sort -z)
      - name: Verify patched dependency lockfiles
        run: node scripts/check-dependency-patches.mjs
      - name: Format source consistently
        run: bunx prettier --write .
      - name: Lint and apply safe formatting fixes
        run: bunx eslint . --fix && bun run lint
      - name: Production build
        if: always()
        run: bun run build
      - name: Type check
        if: always()
        run: bunx tsc --noEmit
      - name: Dependency audit report
        if: always()
        run: bun audit || true
      - name: Block high and critical dependency vulnerabilities
        if: always()
        run: bun audit --audit-level=high
