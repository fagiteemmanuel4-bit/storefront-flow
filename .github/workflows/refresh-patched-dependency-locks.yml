name: Refresh patched dependency lockfiles

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'fix/transitive-advisories-2026-11-08' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transitive-advisories-2026-11-08
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate Bun and npm lockfiles
        run: |
          bun install
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify both dependency audits
        run: |
          bun audit
          npm audit --audit-level=moderate
      - name: Commit lockfile changes
        run: |
          if git diff --quiet -- bun.lock package-lock.json; then
            echo "Lockfiles are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package-lock.json
          git commit -m "chore: regenerate patched dependency lockfiles"
          git push origin HEAD:fix/transitive-advisories-2026-11-08
