name: Repair signup verification flow

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair signup flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/auth.tsx')
          s = p.read_text()
          target = '''sessionStorage.setItem("strap_otp_email", normalizedEmail);\n      sessionStorage.setItem("strap_otp_flow", "signup");\n      await requestLoginOtp(normalizedEmail);'''
          replacement = '''sessionStorage.setItem("strap_otp_email", normalizedEmail);\n      sessionStorage.setItem("strap_otp_flow", "signup");'''
          count = s.count(target)
          if count == 1:
              p.write_text(s.replace(target, replacement))
              print('Removed duplicate OTP request from signup only.')
          elif count == 0:
              print('Signup flow already repaired or target context changed.')
          else:
              raise SystemExit(f'Expected exactly one signup target, found {count}')
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck / lint / build
        run: |
          npm run lint --if-present
          npm run typecheck --if-present
          npm run build

      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/auth.tsx
          git diff --cached --quiet || git commit -m 'fix(auth): stop duplicate signup verification request'
          git push
