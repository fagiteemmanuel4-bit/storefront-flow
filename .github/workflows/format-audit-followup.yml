name: Format audit follow-up

on:
  push:
    branches:
      - audit/ux-integrity-2026-11-08
    paths:
      - scripts/format-audit-followup.trigger

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/audit/ux-integrity-2026-11-08'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without a write credential
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Bun
        run: |
          npm install --global bun@1.3.14 --no-audit --no-fund
          bun --version
      - name: Install dependencies
        run: bun install --no-save
      - name: Format audited files
        run: |
          bunx prettier --write \
            src/components/shell/AppShell.tsx \\
            src/components/settings/SettingsCenter.tsx \\
            src/routes/__root.tsx \\
            src/components/settings/OnlineStoreSettingsPage.tsx \\
            src/routes/_authenticated/branches.tsx \\
            src/routes/_authenticated/online-store/advanced-editor.tsx \\
            src/routes/_authenticated/online-store/builder.tsx \\
            src/routes/_authenticated/notifications.tsx \\
            src/routes/customer-account.tsx \\
            src/routes/_authenticated/pos.tsx \\
            src/routes/_authenticated/electronics-workspace.tsx \\
            src/routes/_authenticated/expenses.tsx \\
            src/routes/_authenticated/food-service.tsx \\
            src/routes/_authenticated/grocery-inventory.tsx \\
            src/routes/_authenticated/online-store/catalog.tsx \\
            src/routes/_authenticated/online-store/orders.tsx \\
            src/routes/_authenticated/products.tsx \\
            src/routes/_authenticated/unit-sale.tsx \\
            src/components/settings/CustomDomainsPanel.tsx \\
            src/components/settings/PaymentsSettingsPage.tsx \\
            src/components/settings/StaffManager.tsx \\
      - name: Commit formatted files to the audit branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/shell/AppShell.tsx \\
            src/components/settings/SettingsCenter.tsx \\
            src/routes/__root.tsx \\
            src/components/settings/OnlineStoreSettingsPage.tsx \\
            src/routes/_authenticated/branches.tsx \\
            src/routes/_authenticated/online-store/advanced-editor.tsx \\
            src/routes/_authenticated/online-store/builder.tsx \\
            src/routes/_authenticated/notifications.tsx \\
            src/routes/customer-account.tsx \\
            src/routes/_authenticated/pos.tsx \\
            src/routes/_authenticated/electronics-workspace.tsx \\
            src/routes/_authenticated/expenses.tsx \\
            src/routes/_authenticated/food-service.tsx \\
            src/routes/_authenticated/grocery-inventory.tsx \\
            src/routes/_authenticated/online-store/catalog.tsx \\
            src/routes/_authenticated/online-store/orders.tsx \\
            src/routes/_authenticated/products.tsx \\
            src/routes/_authenticated/unit-sale.tsx \\
            src/components/settings/CustomDomainsPanel.tsx \\
            src/components/settings/PaymentsSettingsPage.tsx \\
            src/components/settings/StaffManager.tsx \\
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "Format follow-up audit fixes"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
      - name: Recheck lint
        run: bun run lint
        continue-on-error: true
