name: Strap preferences navigation patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[strap-nav-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch settings navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/settings/SettingsCenter.tsx'); s=p.read_text()
          s=s.replace('{ path: "/settings/online-store", title: "Online store", description: "Publishing, catalogue and SEO", icon: Globe2, group: "Store" },','{ path: "/settings/online-store", title: "Strap Online Store", description: "Enable, disable and configure Strap\'s built-in storefront", icon: Globe2, group: "Preferences" },')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/settings/SettingsCenter.tsx
          git commit -m 'feat(settings): place Strap Online Store under preferences [strap-nav-auto]' || true
          git push
