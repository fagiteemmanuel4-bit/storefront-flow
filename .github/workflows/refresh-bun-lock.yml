name: Refresh Bun lockfile and verify build

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/refresh-bun-lock.yml"

permissions:
  contents: write

concurrency:
  group: refresh-bun-lock-main
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate dependency lockfile
        run: bun install

      - name: Verify production build
        run: bun run build

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Refresh Bun lockfile for patched TanStack Start"
          git push origin HEAD:main
