name: Format audit branch

on:
  push:
    branches:
      - audit/ux-integrity-2026-11-08
    paths:
      - scripts/format-audit.trigger

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/audit/ux-integrity-2026-11-08'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without a write credential
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Bun
        run: |
          npm install --global bun@1.3.14 --no-audit --no-fund
          bun --version
      - name: Install dependencies
        run: bun install --no-save
      - name: Format files flagged by the audit lint
        run: |
          bunx prettier --write \
            src/components/settings/StrapMcpSettings.tsx \
            src/routes/oauth.consent.tsx \
            supabase/functions/mcp/index.ts \
            src/routes/mcp.tsx \
            src/components/settings/SettingsCenter.tsx \
            src/routes/_authenticated/reports.tsx \
            src/routes/docs.tsx \
            src/lib/store-export.ts \
            src/components/shell/ThemeProvider.tsx \
            src/routes/_authenticated/products.tsx \
            src/routes/_authenticated/pos.tsx \
            src/lib/offline-sales.ts \
            src/routes/__root.tsx \
            src/routes/_authenticated/dashboard.tsx \
            src/routes/_authenticated/notifications.tsx \
            src/routes/about.tsx
      - name: Commit formatted files to the audit branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/settings/StrapMcpSettings.tsx \
            src/routes/oauth.consent.tsx \
            supabase/functions/mcp/index.ts \
            src/routes/mcp.tsx \
            src/components/settings/SettingsCenter.tsx \
            src/routes/_authenticated/reports.tsx \
            src/routes/docs.tsx \
            src/lib/store-export.ts \
            src/components/shell/ThemeProvider.tsx \
            src/routes/_authenticated/products.tsx \
            src/routes/_authenticated/pos.tsx \
            src/lib/offline-sales.ts \
            src/routes/__root.tsx \
            src/routes/_authenticated/dashboard.tsx \
            src/routes/_authenticated/notifications.tsx \
            src/routes/about.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "Format files flagged by audit lint"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
      - name: Recheck lint
        run: bun run lint
        continue-on-error: true
