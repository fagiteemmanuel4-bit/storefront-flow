[auth]
site_url = "https://storefront-flow.vercel.app"
additional_redirect_urls = ["https://storefront-flow.vercel.app/**"]

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[functions.mcp]
verify_jwt = false

# Authenticated checkout initialization only; provider secrets remain server-side.
[functions.paystack-checkout]
verify_jwt = true

[functions.korapay-create-checkout]
verify_jwt = true

# Provider webhooks authenticate with provider signatures, not user JWTs.
[functions.paystack-webhook]
verify_jwt = false

[functions.korapay-webhook]
verify_jwt = false

[functions.account-security]
verify_jwt = true

[functions.trusted-device]
verify_jwt = true
